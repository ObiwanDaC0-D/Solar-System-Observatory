name: Observatory regression tests
on:
  push:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/astronomy-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/astronomy-tests.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run astronomy regression tests
        run: node --test tests/astronomy-regression.test.cjs
